app:
  name: go-project-template
  environment: development
  shutdown_timeout: 10s

http:
  address: "127.0.0.1:8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s

database:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/app?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5
  connect_timeout: 3s
